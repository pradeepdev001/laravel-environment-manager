name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '8.83.29'
            testbench: '6.47.1'
            pest: '1.23.1'
            pest_laravel: '1.4.0'
          - php: '8.1'
            laravel: '9.52.21'
            testbench: '7.56.0'
            pest: '1.23.1'
            pest_laravel: '1.4.0'
          - php: '8.2'
            laravel: '9.52.21'
            testbench: '7.56.0'
            pest: '1.23.1'
            pest_laravel: '1.4.0'
          - php: '8.1'
            laravel: '10.50.2'
            testbench: '8.37.0'
            pest: '2.36.1'
            pest_laravel: '2.4.0'
          - php: '8.2'
            laravel: '10.50.2'
            testbench: '8.37.0'
            pest: '2.36.1'
            pest_laravel: '2.4.0'
          - php: '8.3'
            laravel: '10.50.2'
            testbench: '8.37.0'
            pest: '2.36.1'
            pest_laravel: '2.4.0'
          - php: '8.2'
            laravel: '11.55.0'
            testbench: '9.17.0'
            pest: '2.36.1'
            pest_laravel: '2.4.0'
          - php: '8.3'
            laravel: '11.55.0'
            testbench: '9.17.0'
            pest: '2.36.1'
            pest_laravel: '2.4.0'
          - php: '8.2'
            laravel: '12.65.0'
            testbench: '10.11.0'
            pest: '3.8.7'
            pest_laravel: '3.2.0'
          - php: '8.3'
            laravel: '12.65.0'
            testbench: '10.11.0'
            pest: '3.8.7'
            pest_laravel: '3.2.0'

    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        env:
          # Older supported Laravel lines currently trigger Composer advisory blocking.
          # Disable advisory blocking for the compatibility matrix so support tests can run.
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel }}" \
            --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest --no-coverage
